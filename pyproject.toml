[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-meta"
version = "0.1.0"
description = "Canopy: agent-verified automated meta-analysis from a folder of paper PDFs (LLM extraction from text, tables and figures; random-effects forest plots with provenance)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "anthropic>=0.122",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openpyxl>=3.1"]

[project.scripts]
canopy = "canopy.cli:app"

[tool.setuptools.packages.find]
include = ["canopy*"]

[tool.setuptools.package-data]
canopy = ["profiles/*.yaml", "llm/prompts/*.md", "server/static/*", "report/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
